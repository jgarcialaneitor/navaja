[project]
name = "navaja"
version = "0.0.1"
description = "MCP server for personal CENDOJ case-law research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "mcp>=2,<3",
    "pypdf>=5.0",
]

[project.scripts]
navaja-doc = "navaja.cli:main"
navaja-mcp = "navaja.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navaja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real CENDOJ site (deselected by default)",
]
